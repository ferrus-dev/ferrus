[package]
name = "ferrus"
version = "0.4.0-alpha.1"
edition = "2024"
rust-version = "1.95.0"
license = "Apache-2.0"
repository = "https://github.com/ferrus-dev/ferrus"
authors = ["Roman Emreis <me@romanemreis.com>"]
readme = "README.md"
homepage = "https://ferrus.dev"
description = "AI agent orchestrator - drives a Supervisor-Executor workflow for autonomous software development"
exclude = [
    ".agents/**",
    ".github/**",
    ".gitignore",
    "AGENTS.md",
    "CLAUDE.md",
    "docs/**",
    "ferrus.toml",
]

[[bin]]
name = "ferrus"
path = "src/main.rs"

[dependencies]
neva = { version = "0.5.2", features = ["server", "di", "legacy-spec"] }
tokio = { version = "1.52.3", features = ["fs", "macros", "process", "rt-multi-thread", "sync", "time"] }
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toml = "1.1.2"
toml_edit = "0.25.11"
anyhow = "1.0.103"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
chrono = { version = "0.4.44", default-features = false, features = ["clock", "serde", "std"] }
fs2 = "0.4.3"
shlex = "2.0.1"
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "6.0.0"
futures-util = { version = "0.3.32", default-features = false, features = ["std"] }
semver = "1.0.28"
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }
rusqlite = { version = "0.40.1", features = ["bundled", "hooks"] }
ring = "0.17.14"
sha2 = "0.10.9"
tree-sitter = "=0.26.11"
tree-sitter-rust = "=0.24.2"

[target.'cfg(unix)'.dependencies]
errno = "0.3.14"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
tempfile = "3.27.0"

[[bench]]
name = "repository_graph"
harness = false

[profile.dist]
inherits = "release"
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = "symbols"

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
